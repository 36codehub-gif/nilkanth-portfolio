<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Nilkanth Patel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="profile-container">
            <img src="file_00000000afb882078d9ea8c5518d6cb4.png" alt="Nilkanth Patel" class="profile-img">
            <h2>Nilkanth Patel</h2>
            <p>Software Engineer</p>
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
            <a href="about.html" class="nav-link"><i class="fa-solid fa-user"></i> About</a>
            <a href="projects.html" class="nav-link"><i class="fa-solid fa-laptop-code"></i> Projects</a>
            <a href="contact.html" class="nav-link active"><i class="fa-solid fa-paper-plane"></i> Contact</a>
        </nav>
    </aside>

    <header class="mobile-header">
        <div class="brand-mobile">
            <img src="file_00000000afb882078d9ea8c5518d6cb4.png" alt="Nilkanth Patel" class="avatar-sm">
            <span>Nilkanth Patel</span>
        </div>
        <a href="contact.html" class="icon-btn"><i class="fa-solid fa-envelope"></i></a>
    </header>

    <main class="main-content">
        <div class="page-title">
            <h1>Get In <span class="gradient-text">Touch</span></h1>
            <p>Reach out directly or send a message</p>
        </div>

        <div class="contact-grid">
            <a href="tel:91111717276" class="contact-chip glass">
                <i class="fa-solid fa-phone icon-accent"></i>
                <div>
                    <span>Call Me</span>
                    <strong>+91 91111717276</strong>
                </div>
            </a>

            <a href="mailto:nilkanthpatel.office@gmail.com" class="contact-chip glass">
                <i class="fa-solid fa-envelope icon-accent"></i>
                <div>
                    <span>Email Me</span>
                    <strong>nilkanthpatel.office@gmail.com</strong>
                </div>
            </a>
        </div>

        <form id="contact-form" class="glass form-block">
            <h3>Quick Message</h3>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea rows="4" placeholder="Your Message..." required></textarea>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
        </form>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-link">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="about.html" class="bottom-nav-link">
            <i class="fa-solid fa-user"></i>
            <span>About</span>
        </a>
        <a href="projects.html" class="bottom-nav-link">
            <i class="fa-solid fa-laptop-code"></i>
            <span>Projects</span>
        </a>
        <a href="contact.html" class="bottom-nav-link active">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Contact</span>
        </a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
